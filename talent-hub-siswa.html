<style>
:root{--bg:#f2f6fc;--card:#fff;--ink:#0d2247;--mut:#5c6f91;--line:#dde6f3;--pri:#1550c8;--navy:#0b1f4d;--acc:#f5a524;--ok:#12805c;--bad:#c62f3d}
[data-theme=dark]{--bg:#0a1226;--card:#131f3d;--ink:#e6edfb;--mut:#95a6c8;--line:#24345c;--pri:#5b8cff;--navy:#070e20}
*{box-sizing:border-box}body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}

input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
input:focus,select:focus,textarea:focus,.btn:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
label{display:block;font-weight:600;margin-bottom:5px;font-size:13px}.fld{margin-bottom:14px}.err{color:var(--bad);font-size:12px}
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:var(--navy);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.hero h1{font-size:44px;line-height:1.05;margin:0;font-weight:800}.hero p{font-size:18px;color:#b9c9ee;max-width:420px;margin:0}
.lbox{display:flex;align-items:center;justify-content:center;padding:24px}.lcard{width:100%;max-width:380px}
.tabs{display:flex;gap:6px;margin-bottom:18px}.tabs button{flex:1}
#app{display:flex;min-height:100vh}
.side{width:236px;background:var(--navy);color:#cfdcf7;padding:18px 12px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;gap:3px;z-index:20;transition:transform .2s}
.side b{color:#fff;font-size:17px;padding:6px 10px 16px;letter-spacing:.5px}
.side a{padding:10px 12px;border-radius:8px;cursor:pointer;color:inherit;text-decoration:none}
.side a:hover{background:#ffffff14}.side a.on{background:var(--pri);color:#fff}.side .sub{padding-left:26px;font-size:13px}
main{margin-left:236px;flex:1;padding:24px;min-width:0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:20px}.top h2{margin:0;font-size:22px;flex:1}
#burger{display:none}
.card{background:var(--card);border-radius:12px;padding:18px;box-shadow:0 1px 3px #0b1f4d14;border:1px solid var(--line)}
.grid{display:grid;gap:16px}.g6{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.stat small{color:var(--mut);display:block}.stat strong{font-size:30px}
.cv{position:relative;height:260px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{cursor:pointer;color:var(--mut);font-size:12px}
td.w{white-space:normal;min-width:160px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.bar>*{flex:1 1 130px;width:auto}.bar .btn{flex:0 0 auto}
.form{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.form .full{grid-column:1/-1}
#modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal .card{max-width:640px;width:100%;max-height:92vh;overflow:auto}
#toast{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px}
.t{padding:11px 16px;border-radius:8px;color:#fff;background:var(--ok);box-shadow:0 4px 14px #0004}.t.e{background:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:36px}
.dl{display:grid;grid-template-columns:150px 1fr;gap:8px 12px}.dl dt{color:var(--mut)}.dl dd{margin:0}
.pg{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:12px}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:99}
#load i{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(1turn)}}
@media(max-width:820px){#login{grid-template-columns:1fr}.hero{padding:28px}.hero h1{font-size:30px}
.side{transform:translateX(-100%)}.side.open{transform:none}main{margin-left:0;padding:14px}#burger{display:inline-block}.form{grid-template-columns:1fr}.dl{grid-template-columns:1fr}}

body{background:radial-gradient(1100px 520px at 88% -8%,#c9dcff 0,transparent 60%),radial-gradient(900px 520px at -8% 108%,#d8f0ff 0,transparent 55%),var(--bg);background-attachment:fixed}

.lcard h2{font-size:24px;font-weight:800}
.btn{background:linear-gradient(135deg,#2b71f2,#1550c8);box-shadow:0 5px 14px #1550c845;border-radius:10px;transition:transform .15s,box-shadow .15s,filter .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px #1550c855}.btn:active{transform:none}
.btn.g{background:transparent;box-shadow:none;border:1.5px solid var(--line)}.btn.g:hover{border-color:var(--pri);color:var(--pri);box-shadow:none}
.btn.r{background:linear-gradient(135deg,#e5586a,#c62f3d);box-shadow:0 5px 14px #c62f3d40}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
input,select,textarea{border:1.5px solid var(--line);border-radius:10px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px #1550c826}
label{color:var(--ink);letter-spacing:.1px}
.side{background:linear-gradient(185deg,#0a1b45 0%,#0b2a72 100%);box-shadow:6px 0 30px #0b1f4d33}
.side b{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;padding:8px 10px 20px}
.side b::before{content:"";width:16px;height:16px;border-radius:50%;border:4px solid var(--acc);box-shadow:0 0 0 3px #ffffff22}
.side a{font-weight:600;transition:background .15s,transform .15s}.side a:hover{background:#ffffff1a;transform:translateX(3px)}
.side a.on{background:linear-gradient(135deg,#2b71f2,#1550c8);color:#fff;box-shadow:0 6px 16px #0007}
.side a#lo{background:#ffffff10;color:#ffc2c8}.side a#lo:hover{background:#c62f3d55;color:#fff}
.top h2{font-size:26px;font-weight:800;letter-spacing:-.3px}
#who{background:#1550c81a;color:var(--pri)!important;padding:6px 14px;border-radius:99px;font-weight:600;font-size:12px}
.card{background:#ffffffcf;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #ffffffb0;border-radius:18px;box-shadow:0 10px 30px #0b1f4d14}
[data-theme=dark] .card{background:#131f3dcc;border-color:#ffffff14}
.stat{position:relative;overflow:hidden;padding-left:24px;transition:transform .15s,box-shadow .15s}
.stat:hover{transform:translateY(-3px);box-shadow:0 14px 34px #0b1f4d24}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c,#1550c8)}
.stat::after{content:"";position:absolute;right:-24px;top:-24px;width:84px;height:84px;border-radius:50%;background:var(--c,#1550c8);opacity:.1}
.g6 .stat:nth-child(1){--c:#1550c8}.g6 .stat:nth-child(2){--c:#0e9fb8}.g6 .stat:nth-child(3){--c:#e26d8b}
.g6 .stat:nth-child(4){--c:#f5a524}.g6 .stat:nth-child(5){--c:#7b4fd8}.g6 .stat:nth-child(6){--c:#12805c}
.stat strong{font-size:36px;font-weight:800;color:var(--c,var(--pri));line-height:1.2}.stat small{font-weight:600}
.tw{border-radius:12px}
th{background:#eef3fc;position:sticky;top:0;color:var(--mut);font-weight:700;transition:color .15s}th:hover{color:var(--pri)}
[data-theme=dark] th{background:#1a2a52}
tbody tr{transition:background .12s}tbody tr:nth-child(even){background:#1550c808}tbody tr:hover{background:#1550c814}
td{font-size:13px}
.tabs .btn{border-radius:99px}
.bar select,.bar input{background:var(--card)}
.t{border-radius:12px;font-weight:600;padding:12px 18px}.t::before{content:"✓  ";font-weight:800}.t.e::before{content:"✕  "}
#modal{background:#0b1f4d99;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#modal .card{background:var(--card);border-radius:22px;padding:24px;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.dl>*{padding-bottom:7px;border-bottom:1px dashed var(--line)}.dl dt{font-weight:600}
.empty{border:2px dashed var(--line);border-radius:14px;margin:8px}
.pg .btn{min-width:34px}
::-webkit-scrollbar{height:9px;width:9px}::-webkit-scrollbar-thumb{background:#9db4e0;border-radius:9px}
@media(max-width:820px){.lcard{padding:26px 20px}.stat strong{font-size:30px}.top h2{font-size:21px}}
</style></head>
<body>
<div id="load"><i></i></div>

<section id="login" class="hide">
 <div class="hero">
  <svg width="54" height="54" viewBox="0 0 54 54"><circle cx="27" cy="27" r="25" fill="none" stroke="#f5a524" stroke-width="3"/><circle cx="27" cy="27" r="14" fill="none" stroke="#fff" stroke-width="3"/><circle cx="27" cy="27" r="4" fill="#f5a524"/></svg>
  <h1>TALENT HUB SISWA</h1><p>Temukan Potensimu. Kembangkan Bakatmu. Tumbuh Bersama.</p>
 </div>
 <div class="lbox"><div class="lcard">
  <h2 style="margin:0 0 4px">Talent Hub Siswa</h2><p style="color:var(--mut);margin:0 0 18px">Masuk untuk melanjutkan.</p>
  <div class="tabs"><button class="btn" id="tL">Masuk</button><button class="btn g" id="tR">Daftar Siswa</button></div>
  <div id="rOnly" class="hide"><div class="fld"><label>Nama Lengkap</label><input id="rNama"></div><div class="fld"><label>NISN</label><input id="rNisn" inputmode="numeric"></div></div>
  <div class="fld"><label>Email / Username</label><input id="lUser" autocomplete="username"></div>
  <div class="fld"><label>Password</label><div style="display:flex;gap:6px"><input id="lPass" type="password" autocomplete="current-password"><button class="btn g" id="eye" type="button">Tampil</button></div></div>
  <div class="err" id="lErr" style="margin-bottom:10px"></div>
  <button class="btn" id="lGo" style="width:100%">Login</button>

 </div></div>
</section>
<div id="app" class="hide"><nav class="side" id="side"></nav><main><div class="top"><button class="btn g" id="burger">Menu</button><h2 id="ttl"></h2><span id="who" style="color:var(--mut)"></span></div><div id="view"></div></main></div>
<div id="modal" class="hide"></div><div id="toast"></div>

<script>
/* ====== PENYIMPANAN LOKAL (localStorage browser) + akun. Data tersimpan di browser ini. ====== */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('th:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'p:'+btoa(unescape(encodeURIComponent(s)))}}
const DB={load(){try{return JSON.parse(localStorage.getItem('th_db'))}catch(e){return null}},save(){localStorage.setItem('th_db',JSON.stringify(db))}};
let db=DB.load()||{users:[],students:[],seq:0};
const sync=()=>{db=DB.load()||db};
const cur=()=>{sync();return db.users.find(u=>u.id===sessionStorage.getItem('th_s'))};
const now=()=>new Date().toISOString();
async function seed(){sync();if(!db.users.some(u=>u.role==='admin')){db.users.push({id:uid(),email:'admin@talent.local',pw:await sha('admin123'),nama:'Administrator',role:'admin'});DB.save()}}
const mk=q=>({select(){return this},order(){return this},range(a,z){q.rng=[a,z];return this},eq(k,v){q.f.push([k,v]);return this},single(){return this},
 insert(v){q.op='ins';q.val=v;return this},update(v){q.op='upd';q.val=v;return this},delete(){q.op='del';return this},upsert(v){q.op='ups';q.val=v;return this},
 then(a,b){return run(q).then(a,b)}});
async function run(q){
 sync();const me=cur();
 if(q.t==='profiles'){const r=db.users.find(x=>q.f.every(([k,v])=>x[k]===v));if(!r)return{data:null,error:{message:'x'}};const {pw,...p}=r;return{data:p,error:null}}
 if(!me)return{data:null,error:{message:'Belum login.'}};
 const adm=me.role==='admin',own=r=>adm||r.user_id===me.id,m=r=>q.f.every(([k,v])=>r[k]===v),S=db.students;
 if(q.op==='select'){let d=S.filter(r=>own(r)&&m(r)).sort((a,b)=>a.nomor-b.nomor);if(q.rng)d=d.slice(q.rng[0],q.rng[1]+1);return{data:JSON.parse(JSON.stringify(d)),error:null}}
 if(q.op==='ins'){const v=q.val;if(S.some(r=>r.nisn===v.nisn))return{error:{code:'23505',message:'dup'}};
  if(!adm&&(v.user_id!==me.id||S.some(r=>r.user_id===me.id)))return{error:{message:'Akses ditolak.'}};
  db.seq++;S.push({...v,id:uid(),nomor:db.seq,user_id:v.user_id||null,created_at:now(),updated_at:now()});DB.save();return{error:null}}
 if(q.op==='upd'){const r=S.find(x=>m(x)&&own(x));if(!r)return{error:{message:'Data tidak ditemukan.'}};
  if(S.some(x=>x!==r&&x.nisn===q.val.nisn))return{error:{code:'23505'}};Object.assign(r,q.val,{updated_at:now()});DB.save();return{error:null}}
 if(q.op==='del'){if(!adm)return{error:{message:'Hanya admin yang boleh menghapus.'}};db.students=S.filter(x=>!m(x));DB.save();return{error:null}}
 if(q.op==='ups'){if(!adm)return{error:{message:'Hanya admin.'}};q.val.forEach(v=>{const r=S.find(x=>x.nisn===v.nisn);if(r)Object.assign(r,v,{updated_at:now()});else{db.seq++;S.push({...v,id:uid(),nomor:db.seq,user_id:null,created_at:now(),updated_at:now()})}});DB.save();return{error:null}}}
const sb={from:t=>{const q={t,op:'select',f:[]};return mk(q)},auth:{
 async getSession(){const u=cur();return{data:{session:u?{user:u}:null}}},
 async signInWithPassword({email,password}){sync();const u=db.users.find(x=>x.email===email.toLowerCase());if(!u||u.pw!==await sha(password))return{error:{message:'x'}};sessionStorage.setItem('th_s',u.id);return{error:null}},
 async signUp({email,password,options}){sync();email=email.toLowerCase();if(db.users.some(x=>x.email===email))return{error:{message:'Username sudah dipakai.'}};
  const u={id:uid(),email,pw:await sha(password),nama:options.data.nama,nisn:options.data.nisn,role:'siswa'};db.users.push(u);DB.save();sessionStorage.setItem('th_s',u.id);return{data:{session:{user:u}},error:null}},
 async signOut(){sessionStorage.removeItem('th_s');return{}},
 async updateUser({password}){const u=cur();u.pw=await sha(password);DB.save();return{error:null}},
 onAuthStateChange(){}}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const OPT={kelas:['X','XI','XII'],jurusan:['Farmasi','DKV','AKP','TKRO','TBSM','TITL','DPIB'],jenis_kelamin:['Laki-laki','Perempuan'],
bakat_utama:['Olahraga','Musik','Tari','Teater','Public Speaking','Menulis','Desain','Teknologi','Fotografi','Akademik','Memasak','Lainnya'],
tingkat_bakat:['Pemula','Menengah','Mahir'],minat_utama:['Teknologi','Olahraga','Seni','Musik','Organisasi','Bisnis','Sains','Bahasa','Desain','Kesehatan','Lainnya'],
tingkat_minat:['Rendah','Sedang','Tinggi'],rencana_setelah_lulus:['Kuliah','Bekerja','Wirausaha','Melanjutkan ke pelatihan/sertifikasi','Belum menentukan','Lainnya']};
const FLD=[['nisn','NISN'],['nama','Nama Siswa'],['kelas','Kelas'],['jurusan','Program Keahlian/Jurusan'],['jenis_kelamin','Jenis Kelamin'],['bakat_utama','Bakat Utama'],['tingkat_bakat','Tingkat Bakat'],['minat_utama','Minat Utama'],['tingkat_minat','Tingkat Minat'],['rencana_setelah_lulus','Rencana Setelah Lulus'],['bakat_minat_lainnya','Bakat/Minat Lainnya'],['catatan','Catatan/Keterangan']];
const REQ={nisn:'NISN wajib diisi.',nama:'Nama siswa wajib diisi.',kelas:'Silakan pilih kelas.',jurusan:'Silakan pilih jurusan.',jenis_kelamin:'Silakan pilih jenis kelamin.',bakat_utama:'Silakan pilih bakat utama.',tingkat_bakat:'Silakan pilih tingkat bakat.',minat_utama:'Silakan pilih minat utama.',tingkat_minat:'Silakan pilih tingkat minat.'};
let me=null,rows=[],view='',charts=[],sortK='nomor',sortD=1,page=1,flt={},regMode=false;
const PER=15;

function toast(m,e){const t=document.createElement('div');t.className='t'+(e?' e':'');t.textContent=m;$('toast').append(t);setTimeout(()=>t.remove(),3500)}
function modal(h){$('modal').innerHTML='<div class="card">'+h+'</div>';$('modal').classList.remove('hide')}
function closeM(){$('modal').classList.add('hide');$('modal').innerHTML=''}
$('modal').onclick=e=>{if(e.target.id==='modal')closeM()};

/* ---------- AUTH ---------- */
const mail=u=>u.includes('@')?u:u+'@talent.local';
function showLogin(){me=null;rows=[];$('app').classList.add('hide');$('login').classList.remove('hide');$('load').classList.add('hide');$('lPass').value=''}
$('eye').onclick=()=>{const p=$('lPass');p.type=p.type==='password'?'text':'password';$('eye').textContent=p.type==='password'?'Tampil':'Sembunyikan'};
function mode(r){regMode=r;$('rOnly').classList.toggle('hide',!r);$('tL').className='btn'+(r?' g':'');$('tR').className='btn'+(r?'':' g');$('lGo').textContent=r?'Daftar':'Login';$('lErr').textContent=''}
$('tL').onclick=()=>mode(false);$('tR').onclick=()=>mode(true);
$('lPass').onkeydown=e=>{if(e.key==='Enter')$('lGo').click()};
$('lGo').onclick=async()=>{
 const u=$('lUser').value.trim(),p=$('lPass').value;$('lErr').textContent='';
 if(!u||!p){$('lErr').textContent='Username dan password wajib diisi.';return}
 if(regMode){
  const nama=$('rNama').value.trim(),nisn=$('rNisn').value.trim();
  if(!nama||!/^\d+$/.test(nisn)){$('lErr').textContent='Nama dan NISN (angka) wajib diisi.';return}
  if(p.length<6){$('lErr').textContent='Password minimal 6 karakter.';return}
  const {data,error}=await sb.auth.signUp({email:mail(u),password:p,options:{data:{nama,nisn}}});
  if(error){$('lErr').textContent=error.message;return}
  if(!data.session){toast('Akun dibuat. Silakan login.');mode(false)}else await enter();
  return}
 const {error}=await sb.auth.signInWithPassword({email:mail(u),password:p});
 if(error){$('lErr').textContent='Username atau password salah.';return}
 await enter()};
async function logout(){await sb.auth.signOut();showLogin();history.replaceState(null,'',location.pathname)}
async function enter(){
 const {data:{session}}=await sb.auth.getSession();if(!session){showLogin();return}
 const {data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
 if(!p){await sb.auth.signOut();showLogin();return}
 me=p;await loadRows();$('login').classList.add('hide');$('load').classList.add('hide');$('app').classList.remove('hide');
 $('who').textContent=p.nama+' ('+p.role+')';go(p.role==='admin'?'dash':'home')}
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')showLogin()});
addEventListener('pageshow',async e=>{if(e.persisted){const {data:{session}}=await sb.auth.getSession();if(!session)showLogin()}});

async function loadRows(){
 let all=[],from=0;
 for(;;){const {data,error}=await sb.from('students').select('*').order('nomor').range(from,from+999);
  if(error){toast('Gagal memuat data: '+error.message,1);break}
  all=all.concat(data);if(data.length<1000)break;from+=1000}
 rows=all}

/* ---------- NAV ---------- */
const NAV={admin:[['dash','Dashboard'],['data','Data Siswa'],['add','Form Siswa'],['rekap','Rekapitulasi'],['r:minat','Minat',1],['r:bakat','Bakat',1],['exp','Export Data'],['set','Pengaturan']],
student:[['home','Beranda'],['mine','Form Minat & Bakat'],['data','Data Saya'],['set','Profil']]};
function go(v){view=v;page=1;charts.forEach(c=>c.destroy());charts=[];
 const nav=NAV[me.role==='admin'?'admin':'student'];
 $('side').innerHTML='<b>TALENT HUB</b>'+nav.map(([k,l,s])=>`<a class="${s?'sub ':''}${(k===v||(k==='rekap'&&v.startsWith('r:')))?'on':''}" data-k="${k}">${l}</a>`).join('')+'<a id="lo" style="margin-top:auto">Logout</a>';
 $('side').querySelectorAll('a[data-k]').forEach(a=>a.onclick=()=>go(a.dataset.k==='rekap'?'r:minat':a.dataset.k));
 $('lo').onclick=logout;$('side').classList.remove('open');
 const T={dash:'Dashboard',data:me.role==='admin'?'Data Siswa':'Data Saya',add:'Form Siswa',exp:'Export Data',set:'Pengaturan',home:'Beranda',mine:'Form Minat & Bakat'};
 $('ttl').textContent=T[v]||'Rekapitulasi '+(v.split(':')[1]||'');
 const fn={dash,data,add:()=>formView(null),mine:()=>formView(rows[0]||null),exp,set,home}[v]||(()=>rekap(v.split(':')[1]));fn()}
$('burger').onclick=()=>$('side').classList.toggle('open');

/* ---------- HELPERS ---------- */
function count(k,src=rows){const m={};src.forEach(r=>{const v=r[k]||'(kosong)';m[v]=(m[v]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
const pct=(n,t)=>t?(n/t*100).toLocaleString('id-ID',{maximumFractionDigits:2})+'%':'0%';
const PAL=['#1550c8','#f5a524','#12805c','#7b4fd8','#c62f3d','#0e9fb8','#8a9bb8','#e26d8b','#4f9d2d','#b5651d','#3b3f99','#d1a300'];
function chart(id,type,k,label){
 const e=count(k),c=$(id);if(!c)return;
 charts.push(new Chart(c,{type,data:{labels:e.map(x=>x[0]),datasets:[{label:label||'Siswa',data:e.map(x=>x[1]),backgroundColor:type==='bar'?'#1550c8':PAL}]},
 options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:type!=='bar',position:'bottom'}},scales:type==='bar'?{y:{beginAtZero:true,ticks:{precision:0}}}:{}}}))}
const empty=m=>`<div class="empty">${m}</div>`;

/* ---------- DASHBOARD ---------- */
function dash(){
 const L=rows.filter(r=>r.jenis_kelamin==='Laki-laki').length,P=rows.filter(r=>r.jenis_kelamin==='Perempuan').length;
 const S=[['Total Siswa',rows.length],['Laki-laki',L],['Perempuan',P],['Jurusan',count('jurusan').length],['Kategori Minat',count('minat_utama').length],['Kategori Bakat',count('bakat_utama').length]];
 const C=[['c1','Minat Siswa'],['c2','Bakat Siswa'],['c3','Jenis Kelamin'],['c4','Siswa per Jurusan'],['c5','Tingkat Bakat'],['c6','Tingkat Minat']];
 $('view').innerHTML=`<div class="grid g6">${S.map(s=>`<div class="card stat"><small>${s[0]}</small><strong>${s[1]}</strong></div>`).join('')}</div>
 <div class="grid g2" style="margin-top:16px">${C.map(c=>`<div class="card"><b>${c[1]}</b><div class="cv"><canvas id="${c[0]}"></canvas></div></div>`).join('')}</div>`;
 if(!rows.length){$('view').insertAdjacentHTML('afterbegin',empty('Belum ada data siswa. Tambahkan lewat Form Siswa atau Import.'));return}
 chart('c1','bar','minat_utama');chart('c2','bar','bakat_utama');chart('c3','doughnut','jenis_kelamin');chart('c4','bar','jurusan');chart('c5','doughnut','tingkat_bakat');chart('c6','doughnut','tingkat_minat')}

/* ---------- REKAP ---------- */
const RK={minat:['minat_utama','Minat'],bakat:['bakat_utama','Bakat'],jurusan:['jurusan','Jurusan'],kelas:['kelas','Kelas'],gender:['jenis_kelamin','Jenis Kelamin'],rencana:['rencana_setelah_lulus','Rencana Setelah Lulus']};
function rekap(t){
 const [k,l]=RK[t];const e=count(k),tot=rows.length;
 $('view').innerHTML=`<div class="tabs" style="flex-wrap:wrap">${Object.entries(RK).map(([a,b])=>`<button class="btn s ${a===t?'':'g'}" onclick="go('r:${a}')">${b[1]}</button>`).join('')}</div>
 <div class="grid g2"><div class="card tw"><table><thead><tr><th>Kategori</th><th>Jumlah Siswa</th><th>Persentasi</th></tr></thead><tbody>
 ${e.map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1]}</td><td>${pct(x[1],tot)}</td></tr>`).join('')||'<tr><td colspan=3>'+empty('Belum ada data.')+'</td></tr>'}
 <tr><th>Total</th><th>${tot}</th><th>${tot?'100%':'0%'}</th></tr></tbody></table></div>
 <div class="card"><div class="cv"><canvas id="rb"></canvas></div></div><div class="card"><div class="cv"><canvas id="rd"></canvas></div></div></div>`;
 if(tot){chart('rb','bar',k);chart('rd','doughnut',k)}}

/* ---------- DATA SISWA ---------- */
function filtered(){
 const q=(flt.q||'').toLowerCase();
 return rows.filter(r=>(!q||r.nama.toLowerCase().includes(q)||r.nisn.includes(q))&&Object.keys(OPT).every(k=>!flt[k]||r[k]===flt[k]))
 .sort((a,b)=>(a[sortK]>b[sortK]?1:a[sortK]<b[sortK]?-1:0)*sortD)}
function data(){
 const adm=me.role==='admin';
 $('view').innerHTML=`<div class="card">${adm?`<div class="bar"><input id="q" placeholder="Cari nama atau NISN…" value="${esc(flt.q||'')}">${Object.keys(OPT).map(k=>`<select data-f="${k}"><option value="">${FLD.find(f=>f[0]===k)[1]}</option>${OPT[k].map(o=>`<option ${flt[k]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`).join('')}<button class="btn g" id="rs">Reset</button><button class="btn" id="ad">+ Tambah Data Siswa</button></div>`:''}<div class="tw" id="tbl"></div><div class="pg" id="pg"></div></div>`;
 if(adm){$('q').oninput=e=>{flt.q=e.target.value;page=1;draw()};
  document.querySelectorAll('[data-f]').forEach(s=>s.onchange=()=>{flt[s.dataset.f]=s.value;page=1;draw()});
  $('rs').onclick=()=>{flt={};data()};$('ad').onclick=()=>go('add')}
 draw()}
function draw(){
 const adm=me.role==='admin',f=filtered(),pages=Math.max(1,Math.ceil(f.length/PER));page=Math.min(page,pages);
 const H=[['nomor','No'],...FLD.slice(0,10).map(x=>x),['bakat_minat_lainnya','Bakat/Minat Lainnya'],['catatan','Catatan']];
 $('tbl').innerHTML=f.length?`<table><thead><tr>${H.map(h=>`<th data-s="${h[0]}">${h[1]}${sortK===h[0]?(sortD>0?' ▲':' ▼'):''}</th>`).join('')}<th>Aksi</th></tr></thead><tbody>
 ${f.slice((page-1)*PER,page*PER).map(r=>`<tr>${H.map(h=>`<td class="${h[0]==='catatan'||h[0]==='bakat_minat_lainnya'?'w':''}">${esc(r[h[0]])}</td>`).join('')}<td><button class="btn s g" onclick="detail('${r.id}')">Detail</button> <button class="btn s g" onclick="edit('${r.id}')">Edit</button>${adm?` <button class="btn s r" onclick="del('${r.id}')">Hapus</button>`:''}</td></tr>`).join('')}</tbody></table>`
 :empty(rows.length?'Tidak ada data yang cocok dengan pencarian/filter.':'Belum ada data.'+(adm?'':' Isi dulu di menu Form Minat & Bakat.'));
 document.querySelectorAll('[data-s]').forEach(t=>t.onclick=()=>{sortD=sortK===t.dataset.s?-sortD:1;sortK=t.dataset.s;draw()});
 $('pg').innerHTML=f.length?`<span>${f.length} data</span><button class="btn s g" ${page<2?'disabled':''} id="pp">‹</button><span>${page}/${pages}</span><button class="btn s g" ${page>=pages?'disabled':''} id="pn">›</button>`:'';
 if($('pp')){$('pp').onclick=()=>{page--;draw()};$('pn').onclick=()=>{page++;draw()}}}
function detail(id){const r=rows.find(x=>x.id===id);
 modal(`<h3 style="margin-top:0">Detail Siswa</h3><dl class="dl">${FLD.map(f=>`<dt>${f[1]}</dt><dd>${esc(r[f[0]])||'-'}</dd>`).join('')}</dl><div style="text-align:right;margin-top:14px"><button class="btn" onclick="closeM()">Tutup</button></div>`)}
function del(id){modal(`<h3 style="margin-top:0">Hapus data</h3><p>Apakah Anda yakin ingin menghapus data siswa ini?</p><div style="text-align:right"><button class="btn g" onclick="closeM()">Batal</button> <button class="btn r" id="dy">Hapus</button></div>`);
 $('dy').onclick=async()=>{const {error}=await sb.from('students').delete().eq('id',id);closeM();if(error)return toast(error.message,1);toast('Data berhasil dihapus.');await loadRows();go(view)}}
function edit(id){const r=rows.find(x=>x.id===id);modal(`<h3 style="margin-top:0">Edit Data Siswa</h3>${formHTML(r)}`);bindForm(r,true)}

/* ---------- FORM ---------- */
function formHTML(s){s=s||{};
 const sel=(k,l)=>`<div class="fld"><label>${l}</label><select id="f_${k}"><option value="">Pilih…</option>${OPT[k].map(o=>`<option ${s[k]===o?'selected':''}>${esc(o)}</option>`).join('')}</select><div class="err" id="e_${k}"></div></div>`;
 const inp=(k,l,x='')=>`<div class="fld"><label>${l}</label><input id="f_${k}" ${x} value="${esc(s[k])}"><div class="err" id="e_${k}"></div></div>`;
 const ta=(k,l)=>`<div class="fld full"><label>${l}</label><textarea id="f_${k}" rows="3">${esc(s[k])}</textarea></div>`;
 const ro=me.role!=='admin'&&me.nisn?'readonly':'';
 return `<div class="form">${inp('nisn','NISN','inputmode="numeric" '+ro).replace('value="'+esc(s.nisn)+'"','value="'+esc(s.nisn||(ro?me.nisn:''))+'"')}${inp('nama','Nama Siswa')}${sel('kelas','Kelas')}${sel('jurusan','Program Keahlian/Jurusan')}${sel('jenis_kelamin','Jenis Kelamin')}${sel('bakat_utama','Bakat Utama')}${sel('tingkat_bakat','Tingkat Bakat')}${sel('minat_utama','Minat Utama')}${sel('tingkat_minat','Tingkat Minat')}${sel('rencana_setelah_lulus','Rencana Setelah Lulus')}${ta('bakat_minat_lainnya','Bakat/Minat Lainnya')}${ta('catatan','Catatan/Keterangan')}
 <div class="full" style="display:flex;gap:8px;justify-content:flex-end"><button class="btn g" id="fb" type="button">Kembali</button><button class="btn g" id="fx">Reset</button><button class="btn" id="fs">Simpan Data</button></div></div>`}
function formView(s){$('view').innerHTML=`<div class="card">${formHTML(s)}</div>`;bindForm(s,false)}
function bindForm(s,inModal){
 $('fb').onclick=()=>go(me.role==='admin'?'data':'home');if(inModal)$('fb').classList.add('hide');
 $('fx').onclick=()=>{inModal?closeM():formView(s)};if(inModal)$('fx').textContent='Batal';
 $('fs').onclick=async()=>{
  const d={};let bad=false;FLD.forEach(([k])=>{d[k]=$('f_'+k).value.trim();const e=$('e_'+k);if(e)e.textContent=''});
  Object.keys(REQ).forEach(k=>{if(!d[k]){$('e_'+k).textContent=REQ[k];bad=true}});
  if(d.nisn&&!/^\d+$/.test(d.nisn)){$('e_nisn').textContent='NISN harus berupa angka.';bad=true}
  if(rows.some(r=>r.nisn===d.nisn&&(!s||r.id!==s.id))){$('e_nisn').textContent='NISN sudah terdaftar.';bad=true}
  if(bad)return;
  $('fs').disabled=true;
  let q;if(s)q=sb.from('students').update(d).eq('id',s.id);
  else q=sb.from('students').insert(me.role==='admin'?d:{...d,user_id:me.id});
  const {error}=await q;$('fs').disabled=false;
  if(error){if(error.code==='23505'){const m='NISN sudah terdaftar.';$('e_nisn').textContent=m}else toast(error.message,1);return}
  toast('Data berhasil disimpan.');if(inModal)closeM();await loadRows();
  if(me.role==='admin')go(inModal?view:'data');else go('mine')}}

/* ---------- SISWA: BERANDA ---------- */
function home(){const s=rows[0];
 $('view').innerHTML=`<div class="card"><h3 style="margin-top:0">Halo, ${esc(me.nama)}</h3>${s?`<p>Data minat & bakatmu sudah tersimpan. Bakat utama: <b>${esc(s.bakat_utama)}</b> (${esc(s.tingkat_bakat)}), minat utama: <b>${esc(s.minat_utama)}</b> (${esc(s.tingkat_minat)}).</p><button class="btn" onclick="go('mine')">Ubah data</button>`:`<p>Kamu belum mengisi data. Isi minat dan bakatmu supaya sekolah bisa membantu mengembangkannya.</p><button class="btn" onclick="go('mine')">Isi form sekarang</button>`}</div>`}

/* ---------- EXPORT / IMPORT / PRINT ---------- */
const COLS=['nomor',...FLD.map(f=>f[0])];const HDR=['No',...FLD.map(f=>f[1])];
const aoa=()=>[HDR,...rows.map(r=>COLS.map(c=>r[c]??''))];
function exp(){
 $('view').innerHTML=`<div class="card"><p>Export berisi seluruh ${rows.length} data siswa.</p><div class="bar"><button class="btn" id="x1">Export Excel</button><button class="btn" id="x2">Export CSV</button><button class="btn g" id="x3">Print Data</button></div>
 <hr style="border:0;border-top:1px solid var(--line)"><h4>Import Excel/CSV</h4><p style="color:var(--mut)">Baris pertama harus memakai judul kolom yang sama seperti hasil export (kolom "No" boleh dikosongkan). Data dengan NISN yang sudah ada akan diperbarui.</p><input type="file" id="imp" accept=".xlsx,.xls,.csv"></div>`;
 $('x1').onclick=()=>{const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa()),'Siswa');XLSX.writeFile(wb,'data-siswa.xlsx')};
 $('x2').onclick=()=>{const c='\ufeff'+XLSX.utils.sheet_to_csv(XLSX.utils.aoa_to_sheet(aoa()));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='data-siswa.csv';a.click()};
 $('x3').onclick=()=>{const w=open('');w.document.write(`<title>Data Siswa</title><style>body{font:11px sans-serif}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:3px}</style><h3>Data Siswa - Talent Mapping SMK</h3><table>${aoa().map((r,i)=>'<tr>'+r.map(c=>i?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join('')+'</tr>').join('')}</table>`);w.document.close();w.print()};
 $('imp').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const wb=XLSX.read(await f.arrayBuffer());const j=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  const out=[],skip=[];
  j.forEach((r,i)=>{const d={};FLD.forEach(([k,l])=>d[k]=String(r[l]??'').trim());
   if(!/^\d+$/.test(d.nisn)||!d.nama||['jenis_kelamin','tingkat_bakat','tingkat_minat'].some(k=>!OPT[k].includes(d[k]))||!d.kelas||!d.jurusan||!d.bakat_utama||!d.minat_utama)skip.push(i+2);else out.push(d)});
  if(out.length){const {error}=await sb.from('students').upsert(out,{onConflict:'nisn'});if(error)return toast(error.message,1)}
  await loadRows();toast(out.length+' data diimpor.'+(skip.length?' Baris dilewati (tidak valid): '+skip.slice(0,10).join(', '):''),skip.length&&!out.length)}}

/* ---------- PENGATURAN ---------- */
function set(){$('view').innerHTML=`<div class="card" style="max-width:480px"><dl class="dl"><dt>Nama</dt><dd>${esc(me.nama)}</dd><dt>Email</dt><dd>${esc(me.email)}</dd><dt>Peran</dt><dd>${me.role}</dd>${me.nisn?`<dt>NISN</dt><dd>${esc(me.nisn)}</dd>`:''}</dl>
 <div class="fld" style="margin-top:16px"><label>Ganti password</label><input id="np" type="password" placeholder="Password baru (min. 6 karakter)"></div>
 <button class="btn" id="cp">Simpan password</button> <button class="btn g" id="dm">Mode gelap</button></div>`;
 $('cp').onclick=async()=>{const p=$('np').value;if(p.length<6)return toast('Password minimal 6 karakter.',1);const {error}=await sb.auth.updateUser({password:p});error?toast(error.message,1):(toast('Password diperbarui.'),$('np').value='')};
 $('dm').onclick=()=>{const d=document.documentElement,x=d.dataset.theme==='dark';d.dataset.theme=x?'':'dark';localStorage.setItem('tm-theme',x?'':'dark')}}

/* ---------- START ---------- */
document.documentElement.dataset.theme=localStorage.getItem('tm-theme')||'';
(async()=>{await seed();const {data:{session}}=await sb.auth.getSession();session?await enter():showLogin()})();
</script></body></html>
